apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitor

data:
  promtail.yaml: |
    server:
      http_listen_port: 9080

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki-service.monitor.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods

        static_configs:
          - targets:
              - localhost

            labels:
              job: kubernetes-pods
              __path__: /var/log/pods/*/*/*.log

        pipeline_stages:
          - cri: {}

          - regex:
              expression: '^(?P<timestamp>\S+)\s+(?P<level>INFO|WARNING|ERROR|DEBUG)\s+(?P<message>.*)$'

          - labels:
              level:

          - timestamp:
              source: timestamp
              format: RFC3339Nano
