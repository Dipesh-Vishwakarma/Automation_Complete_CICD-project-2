apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-frontend
  namespace: app-ns

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask

  template:
    metadata:
      labels:
        app: flask

    spec:
      containers:
      - name: flask
        image: dipesh767/web-application:v1
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
